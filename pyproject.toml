[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minids"
version = "0.1.0"
description = "黑米 Heimi：可渐进增长的迷你 DeepSeek 风格语言模型"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6",
    "huggingface_hub>=0.25",
    "pyarrow>=15",
    "tokenizers>=0.20",
    "safetensors>=0.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["minids*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
